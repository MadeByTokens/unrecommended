[project]
name = "unrecommended"
version = "0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ISC", "EXE", "PLW"]

[tool.ruff.lint.per-file-ignores]
# Mostly SVG markup.
"scripts/make_art.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
