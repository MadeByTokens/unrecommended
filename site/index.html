<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unrecommended</title>
  <meta name="description" content="Videos from a hand-picked list of YouTube channels.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#b4462b">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the videos</a>

  <header class="masthead">
    <div class="masthead-row">
      <a class="brand" href="#/">
        <img class="brand-logo" src="logo.svg" alt="" width="58" height="60">
        <span class="brand-text">
          <span class="brand-title" id="site-title">unrecommended</span>
          <span class="brand-desc" id="site-desc"></span>
        </span>
      </a>
      <form class="search" id="search" role="search">
        <label class="visually-hidden" for="q">Search titles</label>
        <input id="q" type="search" placeholder="Search titles" autocomplete="off">
      </form>
    </div>
    <nav class="shelf" id="shelf" aria-label="Groups"></nav>
  </header>

  <main id="main" tabindex="-1">
    <p class="notice" id="loading">Loading videos…</p>
  </main>

  <footer class="colophon" id="colophon">
    <p>
      <span id="updated"></span>
      <a href="#/about">About this site and your data</a>
    </p>
  </footer>

  <template id="tpl-about">
    <article class="prose">
      <h1>About this site</h1>
      <p>
        This site shows videos from a short list of YouTube channels chosen
        by whoever made it, and nothing else: no comments, no recommendations,
        no home feed. Videos still play from YouTube, so YouTube can see what
        is watched.
      </p>
      <p class="external">
        It was made with <a href="https://github.com/topics/unrecommended">unrecommended</a>,
        a template anyone can copy to make their own list.
      </p>
      <h2>Your data</h2>
      <p>
        What you have watched, your "Watch later" list and where you stopped in
        each video are kept only in this browser. Nothing is sent anywhere.
        To move them to another device or browser, save them to a file here
        and load that file there.
      </p>
      <p class="actions">
        <button type="button" class="button" id="export">Save to a file</button>
        <label class="button">Load from a file
          <input type="file" id="import" accept="application/json,.json" hidden>
        </label>
        <button type="button" class="button danger" id="forget">Forget everything</button>
      </p>
      <p class="notice" id="data-msg" role="status"></p>
    </article>
  </template>
</body>
</html>
